name: Email Brief Automation

on:
  schedule:
    # 8:00 AM IST = 2:30 AM UTC
    - cron: '30 2 * * *'
    # 1:00 PM IST = 7:30 AM UTC
    - cron: '30 7 * * *'
    # 5:30 PM IST = 12:00 PM UTC
    - cron: '0 12 * * *'

  workflow_dispatch:
    inputs:
      label:
        description: 'Brief label (e.g., morning-brief, midday-check)'
        required: false
        default: 'manual-brief'

env:
  OUTLOOK_CLIENT_ID: ${{ secrets.OUTLOOK_CLIENT_ID }}
  OUTLOOK_TENANT_ID: ${{ secrets.OUTLOOK_TENANT_ID }}
  OUTLOOK_REFRESH_TOKEN: ${{ secrets.OUTLOOK_REFRESH_TOKEN }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  EMAILAUTO_PROVIDER: outlook
  EMAILAUTO_OUTLOOK_QUERY: "isRead eq false"
  EMAILAUTO_MODEL: "gemini-2.0-flash"

jobs:
  generate-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine brief label
        id: label
        run: |
          if [ -n "${{ github.event.inputs.label }}" ]; then
            echo "label=${{ github.event.inputs.label }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(TZ='Asia/Kolkata' date +%H)
            if [ "$HOUR" -lt 10 ]; then
              echo "label=morning-brief" >> $GITHUB_OUTPUT
            elif [ "$HOUR" -lt 15 ]; then
              echo "label=midday-brief" >> $GITHUB_OUTPUT
            else
              echo "label=evening-debrief" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Initialize vault
        run: python -m emailauto init

      - name: Generate email brief
        run: |
          python -m emailauto run --label "${{ steps.label.outputs.label }}"

      - name: Upload brief as artifact
        uses: actions/upload-artifact@v4
        with:
          name: email-brief-${{ github.run_id }}
          path: vault/daily/*.md
          retention-days: 7
          if-no-files-found: warn

      - name: Display brief location
        run: |
          echo "Brief generated successfully!"
          echo "Check the 'email-brief-${{ github.run_id }}' artifact for the output."
          ls -la vault/daily/ 2>/dev/null || echo "No briefs found in vault/daily/"
